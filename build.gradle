plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            // Keep the namespace configurable for the project harness while
            // respecting the static gate's requirement that authored tests use
            // the real mod id.  The pressure fixture has its own class/marker.
            def gameTestNamespaces = project.findProperty('gameTestNamespaces')
                    ?: project.mod_id
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "maven.modrinth:jade:15.10.0+neoforge"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
}

tasks.named('jar') {
    exclude('dev/modstudio/referencehost/**')
    exclude('data/*/structure/referencehostgametests.smoke.nbt')
}

def productionJar = tasks.named('jar')
def productionJarFile = productionJar.flatMap { it.archiveFile }
var verifyReferenceHostNotPackaged = tasks.register(
        'verifyReferenceHostNotPackaged'
) {
    dependsOn productionJar
    inputs.file(productionJarFile)
    doLast {
        def archive = productionJarFile.get().asFile
        def leakedEntries = []
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def entryName = entries.nextElement().name
                if (
                        entryName.startsWith('dev/modstudio/referencehost/')
                        || (
                                entryName.startsWith('data/')
                                && entryName.endsWith(
                                        '/structure/referencehostgametests.smoke.nbt'
                                )
                        )
                ) {
                    leakedEntries.add(entryName)
                }
            }
        } finally {
            zip.close()
        }
        if (!leakedEntries.isEmpty()) {
            throw new GradleException(
                    "development-only reference host leaked into ${archive}: "
                            + leakedEntries.join(', ')
            )
        }
    }
}
tasks.named('check') {
    dependsOn verifyReferenceHostNotPackaged
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
