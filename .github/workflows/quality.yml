name: OMT quality

on:
  # Toolkit self-check (doc index, skill integrity).  It reads untracked
  # private pieces under .agents/skills/, so it can never pass on remote
  # push/PR events — keep it manual-only; run it locally or via gh CLI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omt-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  major-quality:
    name: Major quality line
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check documentation index
        run: python .agents/run.py .agents/gates/check_doc_index.py

      - name: Check documentation metadata
        run: python .agents/run.py .agents/gates/check_doc_meta.py

      - name: Run Major quality pipeline
        run: python .agents/run.py .agents/gates/pipeline.py --profile major --gametest-timeout 900

      - name: Run dedicated-server smoke
        run: python .agents/run.py .agents/gates/compile_and_repair.py --with-server

      - name: Audit extension path
        shell: pwsh
        run: .\tools\architecture_phase5_audit.ps1 -EvidenceRoot "$env:GITHUB_WORKSPACE\build\architecture-maturity"

      - name: Audit architecture maturity
        shell: pwsh
        run: .\tools\architecture_maturity_audit.ps1 -EvidenceRoot "$env:GITHUB_WORKSPACE\build\architecture-maturity" -OptimizationEvidenceRoot "$env:GITHUB_WORKSPACE\build\architecture-maturity"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omt-quality-reports-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            build/reports/**
            build/architecture-maturity/**
