name: quality-gates

# Restore of the automated gate runner removed in d085ca6 ("token push
# compatibility").  This workflow is intentionally read-only: it needs no
# secrets and only the default GITHUB_TOKEN with contents:read, so it cannot
# reintroduce the push-token problem that motivated the removal.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: L1 compile + L2 static gate
        run: python .agents/run.py .agents/gates/compile_and_repair.py --with-static

      - name: L0 feature contracts
        run: python .agents/run.py .agents/gates/contract_gate.py --require

      - name: L2.5 asset gate (visual integrity)
        run: python .agents/run.py .agents/gates/asset_gate.py

      - name: L4 GameTests
        run: python .agents/run.py .agents/gates/gametest_gate.py --require-tests --run
